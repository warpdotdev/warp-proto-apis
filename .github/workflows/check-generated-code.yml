name: Check Generated Code

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  check-generated-code:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install protoc
      uses: arduino/setup-protoc@v3
      with:
        version: '36.x'
        repo-token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.25'

    - name: Bootstrap dependencies
      run: ./script/bootstrap
    
    - name: Run code generation
      run: ./script/generate -a multi_agent -v v1
    
    - name: Check for changes
      run: |
        # Check if there are any meaningful changes (ignoring protoc version differences)
        # The -I flag ignores lines matching the pattern (protoc version comments)
        if ! git diff -I '^[[:space:]]*//.*(protoc|protoc-gen-go)[[:space:]]*v[0-9]' --quiet; then
          echo "❌ Generated code is not up to date. Please run './script/generate -a multi_agent -v v1' and commit the changes."
          echo "💡 If you're unable to reproduce this diff locally, check to make sure you have the latest protobuf installed: https://protobuf.dev/installation/"
          echo ""
          echo "📋 Diff details (excluding protoc version changes):"
          git diff -I '^[[:space:]]*//.*(protoc|protoc-gen-go)[[:space:]]*v[0-9]'
          exit 1
        else
          echo "✅ Code generation produced no changes - generated code is up to date!"
        fi

  check-typescript-package:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install protoc
      uses: arduino/setup-protoc@v3
      with:
        version: '36.x'
        repo-token: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Install npm dependencies
      run: npm ci

    - name: Generate TypeScript package bindings
      run: npm run generate:ts

    - name: Pack package
      run: |
        TARBALL="$(npm pack --silent | tail -n 1)"
        echo "TARBALL_PATH=$PWD/$TARBALL" >> "$GITHUB_ENV"

    - name: Validate package install and import
      run: |
        TMP_DIR="$(mktemp -d)"
        pushd "$TMP_DIR" >/dev/null
        npm init -y >/dev/null
        npm install "$TARBALL_PATH"
        node --input-type=module -e "await import('@warp/multi-agent-api-v1/request_pb');"
        popd >/dev/null

name: Check Generated Code

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  check-generated-code:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.21'
    
    - name: Install Protocol Buffers compiler
      run: |
        sudo apt-get update
        sudo apt-get install -y protobuf-compiler
        
    - name: Install protoc-gen-go
      run: |
        go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
        echo "$HOME/go/bin" >> $GITHUB_PATH
    
    - name: Run code generation
      run: ./script/generate -a multi_agent -v v1
    
    - name: Check for changes
      run: |
        # Check if there are any changes in the git working directory
        if ! git diff --quiet; then
          echo "❌ Generated code is not up to date. Please run './script/generate -a multi_agent -v v1' and commit the changes."
          exit 1
        else
          echo "✅ Code generation produced no changes - generated code is up to date!"
        fi
